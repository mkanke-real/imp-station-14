- type: constructionGraph
  id: WallPlatingGraph
  start: start
  graph:
  - node: start
    edges:
    - to: wallPlating
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: Steel
        amount: 1
        doAfter: 1

  - node: wallPlating
    entity: WallPlatingPlain
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 1
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2
